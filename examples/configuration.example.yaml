# Example configuration for Multizone Floor Heating Manager.
# Copy the part you need into configuration.yaml and use your own entity ids.
# Every key is described in docs/configuration.md. Values below the zones are the
# defaults; leave them out unless you want to change them.

multizone_floor_heating_manager:
  # The switch that asks the heat source for heat (e.g. a relay on the heat pump's
  # room thermostat terminals).
  heat_source_switch: switch.heat_pump_request

  # Where notifications go (optional): companion app, email, or notify entities.
  notify:
    - notify.mobile_app_phone
    - notify.email

  # External watchdog ping (optional), e.g. a healthchecks.io check.
  # The URL is a secret: keep it in secrets.yaml.
  watchdog_ping_url: !secret floor_heating_watchdog_url

  # Shelly relays that run the watchdog scripts (docs/shelly-scripts.md).
  shellys_with_watchdog:
    - name: Valves ground floor
      host: 192.0.2.11 # the Shelly's address (documentation example)
      script_id: 1
      switches:
        - switch.valve_living_room
        - switch.valve_kitchen
    - name: Heat pump
      host: 192.0.2.12
      script_id: 1
      password: !secret floor_heating_shelly_password # only if authentication is on
      switches:
        - switch.heat_pump_request

  # Relays without the watchdog script (any other relay).
  relays_without_watchdog:
    - switch.valve_bedroom

  # The zones, in priority order: on a tie, the first one becomes the calling zone.
  # The id must never change once the zone is in use.
  zones:
    - id: living_room
      name: Living room
      sensor: sensor.living_room_temperature
      valve: switch.valve_living_room
      sensor_offset: -0.2 # the sensor reads 0.2 °C too high
    - id: kitchen
      name: Kitchen
      sensor: sensor.kitchen_temperature
      valve: switch.valve_kitchen
    - id: bedroom
      name: Bedroom
      sensor: sensor.bedroom_temperature
      valve: switch.valve_bedroom
    - id: bathroom
      name: Bathroom
      sensor: sensor.bathroom_temperature
      valve: none # no valve: always open, the flow path when every valve is closed

  # Defaults (optional):
  # plausible_min: 0               # readings outside this range are ignored
  # plausible_max: 40
  # reconcile_interval: 60         # s, 10–300
  # output_mismatch_alert: 3       # reconcile intervals before "switch not following"
  # heartbeat_interval: 300        # s, 60–3600
  # heartbeat_fail_alert: 3        # failed heartbeats in a row before an alert
  # heartbeat_timeout: 18000       # s, the scripts' heartbeat_timeout_s
  # heartbeat_check_interval: 60   # s, compare the scripts' check_interval_s too
  # watchdog_ping_interval: 300    # s, 60–3600
