[project]
name = "multizone-floor-heating-manager"
version = "0.0.0"
description = "Home Assistant custom integration for room-by-room underfloor heating zone control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "DTZ",     # no naive datetimes
    "ASYNC",   # async pitfalls (never block HA's event loop, §5.3)
    "PT",      # pytest style
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
files = ["custom_components/multizone_floor_heating_manager", "tests"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Test harness for the HA adapter tests; ships without type information.
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The control core is strictly typed (docs/implementation-plan.md, test strategy).
module = ["custom_components.multizone_floor_heating_manager.core.*"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

# ---------------------------------------------------------------- coverage
# Branch coverage >= 95 % is enforced for the core only.
[tool.coverage.run]
branch = true
source = ["custom_components/multizone_floor_heating_manager/core"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:"]
