# Example entries for Home Assistant's secrets.yaml.
# Copy the keys you need into your own secrets.yaml and fill in real values there.
# Never commit your real secrets.yaml.

# healthchecks.io ping URL for the "HA / integration dead" watchdog: watchdog_ping_url
floor_heating_watchdog_url: "https://hc-ping.com/REPLACE-WITH-YOUR-CHECK-UUID"

# Only needed if authentication is enabled on the Shelly devices (the user name is
# always "admin"). Use it in a shellys entry: password: !secret floor_heating_shelly_password
floor_heating_shelly_password: "REPLACE-WITH-YOUR-SHELLY-PASSWORD"
